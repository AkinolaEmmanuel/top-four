name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

defaults:
  run:
    working-directory: top-four-app

jobs:
  build:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: top-four-app/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  smoke:
    name: Playwright smoke suite
    runs-on: ubuntu-latest
    needs: build
    # Signed-in specs skip themselves cleanly without TF_TEST_EMAIL/
    # TF_TEST_PASSWORD (see tests/auth.setup.ts) — this job still runs and
    # still passes with no secrets configured, just with fewer specs
    # actually exercised. Add those two as repo secrets to run for real.
    env:
      TF_BASE_URL: https://dev.topfour.app
      TF_TEST_EMAIL: ${{ secrets.TF_TEST_EMAIL }}
      TF_TEST_PASSWORD: ${{ secrets.TF_TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: top-four-app/package-lock.json

      - run: npm ci

      # Only chromium: the 'mobile' project (devices['Pixel 7']) is a
      # chromium device emulation, not a separate browser binary.
      - run: npx playwright install --with-deps chromium

      - name: Run the suite
        run: npm run test:smoke

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: top-four-app/test-results/
          retention-days: 14
